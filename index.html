<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BaroCast · Barometric pressure, anywhere</title>
  <meta name="description" content="BaroCast: live barometric pressure for any place on Earth, with history, a 16-day forecast, trend alerts, isobar maps, world rankings and PDF reports.">
  <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1320" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="https://barocast.nz/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BaroCast">
  <meta property="og:url" content="https://barocast.nz/">
  <meta property="og:title" content="BaroCast">
  <meta property="og:description" content="Barometric pressure history, forecast, trend alerts and reports for anywhere in the world.">
  <meta property="og:image" content="https://barocast.nz/assets/icon-512.png">
  <meta name="twitter:card" content="summary">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="privacy-policy" href="privacy.html">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('bpm:settings') || '{}');
      if (s.theme) document.documentElement.dataset.theme = s.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="BaroCast home">
      <img src="assets/icon.svg" alt="" width="30" height="30">
      <span class="brand-name">Baro<span>Cast</span></span>
    </a>
    <nav class="nav-desktop" aria-label="Main">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/world" data-nav="world">World</a>
      <a href="#/report" data-nav="report">Reports</a>
      <a href="#/learn" data-nav="learn">Learn</a>
    </nav>
    <div class="topbar-actions">
      <button class="icon-btn search-trigger" type="button" data-action="search" aria-label="Search for a place">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="search-trigger-label">Search places</span>
        <kbd>/</kbd>
      </button>
      <button class="icon-btn" type="button" data-action="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <aside class="ad-side ad-side-left" aria-label="Advertisement"></aside>
  <main id="main" tabindex="-1"></main>
  <aside class="ad-side ad-side-right" aria-label="Advertisement"></aside>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-nav="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="#/world" data-nav="world">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
      <span>World</span>
    </a>
    <button type="button" data-action="search" class="tab-search" aria-label="Search for a place">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search</span>
    </button>
    <a href="#/report" data-nav="report">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>
      <span>Reports</span>
    </a>
    <a href="#/learn" data-nav="learn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/></svg>
      <span>Learn</span>
    </a>
  </nav>

  <!-- Search palette -->
  <dialog class="sheet search-dialog" id="search-dialog" aria-label="Search for a place">
    <form method="dialog" class="search-box" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="City, town or postcode…" aria-label="Place name" aria-controls="search-results">
      <button class="icon-btn" value="close" aria-label="Close search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </form>
    <button type="button" class="locate-row" data-action="locate">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
      Use my current location
    </button>
    <ul class="search-results" id="search-results" role="listbox"></ul>
    <p class="search-hint">Tip: press <kbd>/</kbd> anywhere to search. Coordinates like <code>-45.87, 170.50</code> work too.</p>
  </dialog>

  <!-- Settings -->
  <dialog class="sheet settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog">
      <div class="sheet-head">
        <h2 id="settings-title">Settings</h2>
        <button class="icon-btn" value="close" aria-label="Close settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="settings-body" id="settings-body"></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/chartjs/chart.umd.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
